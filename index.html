<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>拼音学习 - 儿童版</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 顶栏 -->
        <div class="top-bar">
            <div class="stars-display" id="stars-display">
                <span class="star-icon">⭐</span> 0
            </div>
            <div class="mode-toggle">
                <button class="mode-btn active" id="mode-learn">📖 学习</button>
                <button class="mode-btn" id="mode-practice">✏️ 练习</button>
            </div>
            <div class="combo-text" id="combo-text"></div>
        </div>

        <!-- 标题 -->
        <div style="text-align:center;">
            <span class="title">拼音学习</span>
        </div>

        <!-- 主卡片 -->
        <div class="main-card" id="main-card">
            <div id="card-content">
                <!-- 由 JS 动态渲染 -->
            </div>
        </div>

        <!-- 类别切换 -->
        <div class="category-bar" id="category-bar">
            <!-- 由 JS 动态渲染 -->
        </div>

        <!-- 导航按钮 -->
        <div class="nav-bar" id="nav-bar">
            <!-- 由 JS 动态渲染 -->
        </div>
    </div>

    <!-- JS 模块 -->
    <script src="js/data.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
